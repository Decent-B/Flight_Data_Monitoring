---
# NiFi Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: nifi
---
# NiFi PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nifi-data
  namespace: nifi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# NiFi Secrets
apiVersion: v1
kind: Secret
metadata:
  name: nifi-credentials
  namespace: nifi
type: Opaque
stringData:
  NIFI_SINGLE_USER_USERNAME: admin
  NIFI_SINGLE_USER_PASSWORD: Utlinhsaygex123.
  OPENSKY_CLIENT_SECRET: paHxSeaWLsaVrXDP0dT3cIkHYds8Top8
  NIFI_SENSITIVE_PROPS_KEY: nifi-sensitive-props-key-2026-change-me
---
# NiFi ConfigMap for API parameters
apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-api-params
  namespace: nifi
data:
  airports_icao.txt: |
    WSSS
    VVNB
    VTBS
    RPLL
    WMKK
---
# NiFi Service
apiVersion: v1
kind: Service
metadata:
  name: nifi
  namespace: nifi
spec:
  selector:
    app: nifi
  ports:
    - name: https
      port: 8443
      targetPort: 8443
  type: NodePort
---
# NiFi Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi
  namespace: nifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nifi
  template:
    metadata:
      labels:
        app: nifi
    spec:
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "kafka"
          effect: "NoSchedule"
      containers:
        - name: nifi
          image: apache/nifi:latest
          ports:
            - containerPort: 8443
              name: https
          env:
            - name: SINGLE_USER_CREDENTIALS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nifi-credentials
                  key: NIFI_SINGLE_USER_USERNAME
            - name: SINGLE_USER_CREDENTIALS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nifi-credentials
                  key: NIFI_SINGLE_USER_PASSWORD
            - name: NIFI_SENSITIVE_PROPS_KEY
              valueFrom:
                secretKeyRef:
                  name: nifi-credentials
                  key: NIFI_SENSITIVE_PROPS_KEY
            - name: NIFI_WEB_HTTPS_HOST
              value: "0.0.0.0"
            - name: NIFI_WEB_HTTPS_PORT
              value: "8443"
            - name: NIFI_WEB_PROXY_HOST
              value: "nifi.nifi.svc.cluster.local:8443,nifi:8443,localhost:8443"
            - name: NIFI_JVM_HEAP_INIT
              value: "1g"
            - name: NIFI_JVM_HEAP_MAX
              value: "2g"
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: nifi-api-params
              mountPath: /opt/nifi/nifi-data/config
          startupProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: nifi-api-params
          configMap:
            name: nifi-api-params
