# Kafka Producer Deployment for EKS
# Fetches data from OpenSky API and publishes to Kafka
---
apiVersion: v1
kind: Namespace
metadata:
  name: producer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: producer-config
  namespace: producer
data:
  # Kafka configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka-controller-0.kafka-controller-headless.kafka.svc.cluster.local:9092,kafka-controller-1.kafka-controller-headless.kafka.svc.cluster.local:9092,kafka-controller-2.kafka-controller-headless.kafka.svc.cluster.local:9092"
  KAFKA_TOPIC: "flights_raw"
  
  # OpenSky API configuration
  OPENSKY_API_URL: "https://opensky-network.org/api/states/all"
  
  # Producer settings
  FETCH_INTERVAL_SECONDS: "10"
  BATCH_SIZE: "100"
  
  # Rate limiting to avoid API throttling
  MAX_REQUESTS_PER_MINUTE: "6"
---
apiVersion: v1
kind: Secret
metadata:
  name: producer-secrets
  namespace: producer
type: Opaque
stringData:
  # OpenSky API credentials (optional, increases rate limits)
  OPENSKY_USERNAME: ""
  OPENSKY_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer
  namespace: producer
  labels:
    app: kafka-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-producer
  template:
    metadata:
      labels:
        app: kafka-producer
    spec:
      # Schedule on app nodes
      nodeSelector:
        role: app
      
      containers:
      - name: kafka-producer
        # Replace with actual ECR image
        image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/flight-data-producer:latest
        imagePullPolicy: Always
        
        envFrom:
        - configMapRef:
            name: producer-config
        - secretRef:
            name: producer-secrets
        
        # Minimal resources - producer is lightweight
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        
        # Liveness probe
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f "python" > /dev/null
          initialDelaySeconds: 30
          periodSeconds: 60
          failureThreshold: 3
      
      restartPolicy: Always
