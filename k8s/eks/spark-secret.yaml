# Spark Secret for EKS
# Contains sensitive configuration for Spark Structured Streaming
# Note: In production, use AWS Secrets Manager or external-secrets operator
---
apiVersion: v1
kind: Secret
metadata:
  name: spark-stream-secrets
  namespace: spark
type: Opaque
stringData:
  # Cassandra credentials (if authentication enabled)
  CASSANDRA_USERNAME: "cassandra"
  CASSANDRA_PASSWORD: "cassandra"
  
  # AWS credentials are provided via IRSA (IAM Roles for Service Accounts)
  # These are only needed if not using IRSA
  # AWS_ACCESS_KEY_ID: ""
  # AWS_SECRET_ACCESS_KEY: ""
  
  # MinIO credentials (only if using MinIO instead of S3)
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
