apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi-registry
  namespace: nifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nifi-registry
  template:
    metadata:
      labels:
        app: nifi-registry
    spec:
      containers:
        - name: nifi-registry
          image: apache/nifi-registry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: nifi-registry-data
              mountPath: /opt/nifi-registry/nifi-registry-current/database
              subPath: database
      volumes:
        - name: nifi-registry-data
          persistentVolumeClaim:
            claimName: nifi-registry-data
