---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: superset
data:
  superset_config.py: |
    import os
    SECRET_KEY = os.environ.get('SECRET_KEY', 'thisISaSECRET_1234')
    SQLALCHEMY_DATABASE_URI = 'sqlite:////var/lib/superset/superset.db'
    
    # Trino will be added via UI
    FEATURE_FLAGS = {
        "DASHBOARD_NATIVE_FILTERS": True,
        "ENABLE_TEMPLATE_PROCESSING": True,
    }
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: superset
spec:
  type: NodePort
  ports:
  - port: 8088
    targetPort: 8088
    protocol: TCP
  selector:
    app: superset
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      containers:
      - name: superset
        image: apache/superset:latest
        ports:
        - containerPort: 8088
        env:
        - name: SUPERSET_SECRET_KEY
          value: "thisISaSECRET_1234"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Installing Trino connector..."
          pip install trino sqlalchemy-trino
          
          echo "Initializing database..."
          superset db upgrade
          
          echo "Creating admin user..."
          superset fab create-admin \
            --username admin \
            --firstname Admin \
            --lastname User \
            --email admin@superset.com \
            --password admin || true
          
          echo "Initializing Superset..."
          superset init
          
          echo "Starting Superset..."
          superset run -h 0.0.0.0 -p 8088 --with-threads --reload
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: superset-data
          mountPath: /var/lib/superset
        readinessProbe:
          httpGet:
            path: /health
            port: 8088
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8088
          initialDelaySeconds: 90
          periodSeconds: 30
      volumes:
      - name: superset-data
        emptyDir: {}
