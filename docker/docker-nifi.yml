version: '3.8'

services:
  nifi:
    build:
      context: .
      dockerfile: Dockerfile
    image: custom-nifi-secure
    container_name: project_nifi
    restart: unless-stopped
    ports:
      # Expose only HTTPS for NiFi UI
      - "8443:8443"
    environment:
      # Force NiFi to listen on HTTPS (default for many NiFi images)
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=Utlinhsaygex123.
      - NIFI_WEB_HTTPS_HOST=nifi
      - NIFI_WEB_HTTPS_PORT=8443
      # Ensure HTTP is not implicitly enabled
      # (Do not set NIFI_WEB_HTTP_PORT here if you want HTTPS-only mode)
      # Optional: set a stable sensitive props key if you want encrypted sensitive properties to be portable
      # - NIFI_SENSITIVE_PROPS_KEY=replace_with_a_strong_key
    # Named volumes for all NiFi data/config (per your request)
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_flowfile_repo:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repo:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repo:/opt/nifi/nifi-current/provenance_repository
      - nifi_database_repo:/opt/nifi/nifi-current/database_repository
      - nifi_logs:/opt/nifi/nifi-current/logs
      - nifi_state:/opt/nifi/nifi-current/state

    # Robust healthcheck: uses HTTPS, accepts self-signed certs, waits a bit before starting checks
    healthcheck:
      test: ["CMD-SHELL", "curl -kSf --max-time 10 https://localhost:8443/nifi/ >/dev/null 2>&1 || (echo 'NiFi healthcheck failed' >&2; exit 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - docker_flight-network   # Connect NiFi to the shared flight-network

  nifi-registry:
    image: apache/nifi-registry:latest
    container_name: nifi-registry
    restart: unless-stopped
    ports:
      - "18080:18080"
    volumes:
      - registry_conf:/opt/nifi-registry/nifi-registry-current/conf
      - registry_db:/opt/nifi-registry/nifi-registry-current/database
    networks:
      - docker_flight-network
    user: root
    command:
    - /bin/bash
    - -c
    - |
      # Change ownership of the volume mount points to the user that runs NiFi Registry (often UID 1000)
      # Check the image documentation for the exact UID/GID, but 1000 is common.
      chown -R 1000:1000 /opt/nifi-registry/nifi-registry-current/conf
      chown -R 1000:1000 /opt/nifi-registry/nifi-registry-current/database
      # Now, execute the original entrypoint script (this is often 'nifi-registry.sh start')
      /opt/nifi-registry/nifi-registry-current/bin/nifi-registry.sh start

  flow-deployer:
    image: python:3.11-slim
    container_name: flow-deployer
    depends_on:
      - nifi
      - nifi-registry
    # mount flows and the script into container
    volumes:
      - ../nifi/flows:/flows
      - ../nifi/scripts:/scripts:ro
    networks:
      - docker_flight-network
    environment:
      - NIFI_API_URL=https://nifi:8443
      - REGISTRY_API_URL=http://nifi-registry:18080
      - NIFI_USERNAME=admin
      - NIFI_PASSWORD=Utlinhsaygex123.
      # Set to "true" if you want to ignore self-signed cert issues (dev only)
      - INSECURE_SKIP_TLS_VERIFY=true
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir nipyapi requests || exit 1
        # run script; it will retry/wait for services
        python /scripts/deploy_flow.py    
volumes:
  nifi_conf:
  nifi_flowfile_repo:
  nifi_content_repo:
  nifi_provenance_repo:
  nifi_database_repo:
  nifi_logs:
  nifi_state:

networks:
  docker_flight-network:
    external: true
